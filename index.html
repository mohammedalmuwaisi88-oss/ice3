<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nana's | قائمة الحلويات والآيس كريم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #FDFBF7;
            --bg-card: #FFFFFF;
            --bg-alt: #F7F3EC;
            --color-brown-dark: #2C1A14;
            --color-brown-mid: #5C4033;
            --color-berry: #802336;
            --color-gold: #C59B27;
            --color-text: #221C19;
            --color-text-muted: #665A54;
            --color-border: #E8DFD5;
            --radius-md: 16px;
            --radius-full: 9999px;
            --shadow-sm: 0 4px 12px rgba(44, 26, 20, 0.04);
            --shadow-md: 0 8px 24px rgba(44, 26, 20, 0.08);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--color-text);
            font-family: 'Cairo', 'Tajawal', sans-serif;
            line-height: 1.6;
            direction: rtl;
        }

        header {
            background-color: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-brown-dark);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .logo span {
            font-size: 0.65rem;
            color: var(--color-berry);
            letter-spacing: 0.1em;
            margin-top: 4px;
        }

        .admin-badge {
            background-color: var(--bg-alt);
            border: 1px solid var(--color-border);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-brown-mid);
            text-decoration: none;
            transition: all 0.2s;
        }
        .admin-badge:hover {
            background-color: var(--color-brown-dark);
            color: #FFF;
        }

        .hero-banner {
            text-align: center;
            padding: 3.5rem 1.5rem 2rem;
            background: linear-gradient(180deg, var(--bg-alt) 0%, var(--bg-main) 100%);
        }

        .hero-banner h1 {
            font-size: 2.5rem;
            color: var(--color-brown-dark);
            margin-bottom: 0.5rem;
        }

        .hero-banner p {
            color: var(--color-text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem 5rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.75rem;
            margin-top: 2rem;
        }

        .product-card {
            background-color: var(--bg-card);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: var(--bg-alt);
        }

        .product-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-brown-dark);
            margin-bottom: 0.35rem;
        }

        .product-desc {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            margin-bottom: 1.25rem;
            flex-grow: 1;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px dashed var(--color-border);
            padding-top: 0.75rem;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--color-berry);
        }

        .order-btn {
            background-color: var(--color-brown-dark);
            color: #FFF;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.875rem;
            transition: background 0.2s;
        }

        .order-btn:hover {
            background-color: var(--color-berry);
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">
                NANA'S
                <span>WESTBURY, NY</span>
            </a>
            <a href="admin.html" class="admin-badge">⚙️ لوحة التحكم (المدير)</a>
        </div>
    </header>

    <section class="hero-banner">
        <h1>لحظات حلوة، صُنعت في نانا</h1>
        <p>استكشف قائمة الحلويات والآيس كريم الفاخرة</p>
    </section>

    <main class="container">
        <div class="product-grid" id="product-grid">
            <!-- تحميل الأصناف من قاعدة البيانات -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ضع روابط مفاتيح Supabase الخاصة بك هنا
        const SUPABASE_URL = 'https://gtynotqcwgdeynzmgbly.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_2c6dYLHIeaR6ohv7Tl5bQQ_QkDAOwsq';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const DEFAULT_PRODUCTS = [
            { id: 1, name: 'حلم Strawberry', description: 'آيس كريم فراولة طازجة مع قطع الفاكهة والكريمة.', price: 8.50, image: 'https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=600&q=80' },
            { id: 2, name: 'سعادة Blueberry', description: 'حلويات التوت الأزرق الغنية بالكريمة اللذيذة.', price: 8.75, image: 'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=600&q=80' },
            { id: 3, name: 'سحابة Vanilla Cloud', description: 'فانيليا فاخرة كلاسيكية بقوام كريمي ناعم.', price: 7.50, image: 'https://images.unsplash.com/photo-1570197788417-0e82375c9371?auto=format&fit=crop&w=600&q=80' },
            { id: 4, name: 'جنة الشوكولاتة', description: 'شوكولاتة داكنة غنية لعشاق الشوكولاتة الأصليين.', price: 8.25, image: 'https://images.unsplash.com/photo-1580915411954-282cb1b0d780?auto=format&fit=crop&w=600&q=80' }
        ];

        async function fetchProducts() {
            const gridContainer = document.getElementById('product-grid');
            let products = [];

            try {
                const { data, error } = await supabase.from('products').select('*').order('id', { ascending: true });
                if (error || !data || data.length === 0) {
                    products = DEFAULT_PRODUCTS;
                } else {
                    products = data;
                }
            } catch (err) {
                products = DEFAULT_PRODUCTS;
            }

            gridContainer.innerHTML = products.map(prod => `
                <div class="product-card">
                    <img src="${prod.image}" alt="${prod.name}" class="product-img">
                    <div class="product-info">
                        <h3 class="product-title">${prod.name}</h3>
                        <p class="product-desc">${prod.description || ''}</p>
                        <div class="product-bottom">
                            <span class="product-price">$${parseFloat(prod.price).toFixed(2)}</span>
                            <a href="https://wa.me/96872420073?text=${encodeURIComponent('أود طلب: ' + prod.name)}" target="_blank" class="order-btn">طلب واتساب</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
