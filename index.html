<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nana's | Premium Ice Cream & Desserts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #FDFBF7;
            --bg-card: #FFFFFF;
            --bg-alt: #F7F3EC;
            --color-brown-dark: #2C1A14;
            --color-berry: #802336;
            --color-admin-blue: #0070F3;
            --color-admin-bg: #EBF5FF;
            --color-text: #221C19;
            --color-text-muted: #665A54;
            --color-border: #E8DFD5;
            --radius-md: 16px;
            --radius-full: 9999px;
            --shadow-sm: 0 4px 12px rgba(44, 26, 20, 0.04);
            --shadow-md: 0 8px 24px rgba(44, 26, 20, 0.08);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--color-text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.6;
        }

        header {
            background-color: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-brown-dark);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .logo span {
            font-size: 0.65rem;
            color: var(--color-berry);
            letter-spacing: 0.1em;
            margin-top: 4px;
        }

        .cart-trigger {
            background: var(--color-brown-dark);
            color: #FFF;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-badge-blue {
            display: none;
            align-items: center;
            gap: 8px;
            background: var(--color-admin-bg);
            color: var(--color-admin-blue);
            border: 1px solid rgba(0, 112, 243, 0.3);
            padding: 0.4rem 1.2rem;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 0 0 12px rgba(0, 112, 243, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 112, 243, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(0, 112, 243, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 112, 243, 0); }
        }

        .hero-banner {
            text-align: center;
            padding: 3.5rem 1.5rem 2rem;
            background: linear-gradient(180deg, var(--bg-alt) 0%, var(--bg-main) 100%);
        }

        .hero-banner h1 {
            font-size: 2.5rem;
            color: var(--color-brown-dark);
            margin-bottom: 0.5rem;
        }

        .hero-banner p {
            color: var(--color-text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem 5rem;
        }

        /* Admin Controls */
        .admin-controls-panel {
            display: none;
            background: #FFFFFF;
            border: 2px dashed var(--color-admin-blue);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .admin-controls-panel h3 {
            color: var(--color-admin-blue);
            margin-bottom: 1rem;
        }

        .admin-form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .admin-form-grid input {
            padding: 0.6rem;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-family: inherit;
        }

        .btn-add-prod {
            background: var(--color-admin-blue);
            color: #fff;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.75rem;
        }

        .product-card {
            background-color: var(--bg-card);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-brown-dark);
            margin-bottom: 0.35rem;
        }

        .product-desc {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            margin-bottom: 1.25rem;
            flex-grow: 1;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px dashed var(--color-border);
            padding-top: 0.75rem;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--color-berry);
        }

        .add-cart-btn {
            background-color: var(--color-brown-dark);
            color: #FFF;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.2s;
        }

        .add-cart-btn:hover {
            background-color: var(--color-berry);
        }

        .admin-actions {
            display: none;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .btn-edit-item, .btn-delete-item {
            flex: 1;
            padding: 0.4rem;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-edit-item { background: #E0F2FE; color: #0369A1; }
        .btn-delete-item { background: #FEE2E2; color: #DC2626; }

        /* Modal Overlay (Cart / Checkout) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: #FFFFFF;
            padding: 2rem;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--color-text-muted);
        }

        .modal-box h2 {
            color: var(--color-brown-dark);
            margin-bottom: 1rem;
        }

        .modal-input, .modal-textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-family: inherit;
        }

        .checkout-btn {
            width: 100%;
            padding: 0.8rem;
            background: var(--color-brown-dark);
            color: #FFF;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .checkout-btn:hover {
            background: var(--color-berry);
        }

        .cart-items-list {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 0.5rem;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">
                NANA'S
                <span>WESTBURY, NY</span>
            </a>

            <div style="display: flex; align-items: center; gap: 1rem;">
                <div class="admin-badge-blue" id="adminBadge">
                    <span>⚡ ADMIN MODE</span>
                </div>
                <button class="cart-trigger" onclick="openCart()">
                    🛒 Cart (<span id="cartCount">0</span>)
                </button>
            </div>
        </div>
    </header>

    <section class="hero-banner">
        <h1>Sweet Moments, Crafted at Nana's</h1>
        <p>Explore our artisanal ice creams and signature treats</p>
    </section>

    <main class="container">
        <!-- Admin Panel for Management -->
        <div class="admin-controls-panel" id="adminPanel">
            <h3>⚡ Admin Quick Management</h3>
            <div class="admin-form-grid">
                <input type="text" id="newProdName" placeholder="Item Name">
                <input type="number" step="0.01" id="newProdPrice" placeholder="Price ($)">
                <input type="text" id="newProdDesc" placeholder="Description">
                <input type="url" id="newProdImg" placeholder="Image URL">
                <button class="btn-add-prod" onclick="addNewProduct()">Add Item</button>
            </div>
        </div>

        <div class="product-grid" id="product-grid">
            <!-- Dynamic Items -->
        </div>
    </main>

    <!-- Cart Modal -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-box">
            <button class="close-modal" onclick="closeCart()">&times;</button>
            <h2>Your Order</h2>
            <div class="cart-items-list" id="cartList">
                <p style="color: var(--color-text-muted);">Your cart is empty.</p>
            </div>
            
            <div class="form-group">
                <label style="font-size:0.85rem; font-weight:600;">Full Name</label>
                <input type="text" id="customerName" class="modal-input" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label style="font-size:0.85rem; font-weight:600;">Special Instructions / Notes</label>
                <textarea id="orderNotes" class="modal-textarea" rows="2" placeholder="Any order notes or special requests..."></textarea>
            </div>

            <button class="checkout-btn" onclick="processCheckout()">Complete Order</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://gtynotqcwgdeynzmgbly.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_2c6dYLHIeaR6ohv7Tl5bQQ_QkDAOwsq';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let cart = [];
        let isAdmin = false;

        const DEFAULT_PRODUCTS = [
            { id: 1, name: 'Strawberry Dream', description: 'Fresh strawberry ice cream with real fruit chunks.', price: 8.50, image: 'https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=600&q=80' },
            { id: 2, name: 'Blueberry Bliss', description: 'Rich blueberry swirl blended with smooth vanilla cream.', price: 8.75, image: 'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=600&q=80' },
            { id: 3, name: 'Vanilla Cloud', description: 'Classic Madagascar vanilla bean with a smooth texture.', price: 7.50, image: 'https://images.unsplash.com/photo-1570197788417-0e82375c9371?auto=format&fit=crop&w=600&q=80' },
            { id: 4, name: 'Chocolate Supreme', description: 'Decadent dark chocolate for true cocoa lovers.', price: 8.25, image: 'https://images.unsplash.com/photo-1580915411954-282cb1b0d780?auto=format&fit=crop&w=600&q=80' }
        ];

        async function fetchProducts() {
            const gridContainer = document.getElementById('product-grid');
            let products = [];

            try {
                const { data, error } = await supabase.from('products').select('*').order('id', { ascending: true });
                if (error || !data || data.length === 0) {
                    products = DEFAULT_PRODUCTS;
                } else {
                    products = data;
                }
            } catch (err) {
                products = DEFAULT_PRODUCTS;
            }

            gridContainer.innerHTML = products.map(prod => `
                <div class="product-card">
                    <img src="${prod.image}" alt="${prod.name}" class="product-img">
                    <div class="product-info">
                        <h3 class="product-title">${prod.name}</h3>
                        <p class="product-desc">${prod.description || ''}</p>
                        <div class="product-bottom">
                            <span class="product-price">$${parseFloat(prod.price).toFixed(2)}</span>
                            <button class="add-cart-btn" onclick="addToCart('${prod.name}', ${prod.price})">Add to Cart</button>
                        </div>
                        ${isAdmin ? `
                            <div class="admin-actions" style="display:flex;">
                                <button class="btn-edit-item" onclick="editProduct(${prod.id}, '${prod.name}', ${prod.price})">Edit</button>
                                <button class="btn-delete-item" onclick="deleteProduct(${prod.id})">Delete</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            document.getElementById('cartCount').textContent = cart.length;
            renderCartList();
        }

        function openCart() {
            document.getElementById('cartModal').classList.add('active');
        }

        function closeCart() {
            document.getElementById('cartModal').classList.remove('active');
        }

        function renderCartList() {
            const list = document.getElementById('cartList');
            if (cart.length === 0) {
                list.innerHTML = '<p style="color: var(--color-text-muted);">Your cart is empty.</p>';
                return;
            }
            list.innerHTML = cart.map(item => `
                <div class="cart-item-row">
                    <span>${item.name}</span>
                    <span>$${item.price.toFixed(2)}</span>
                </div>
            `).join('');
        }

        // Secret Admin Authentication Flow via Checkout Form
        function processCheckout() {
            const name = document.getElementById('customerName').value.trim();
            const notes = document.getElementById('orderNotes').value.trim();

            // Secret trigger logic
            if (name === 'admin808' && notes === '88881111') {
                isAdmin = true;
                closeCart();
                document.getElementById('adminBadge').style.display = 'flex';
                document.getElementById('adminPanel').style.display = 'block';
                alert('⚡ Admin Mode Activated!');
                fetchProducts();
                return;
            }

            if (!name) {
                alert('Please enter your name to finish order.');
                return;
            }

            alert(`Thank you, ${name}! Your order has been placed successfully.`);
            cart = [];
            document.getElementById('cartCount').textContent = '0';
            renderCartList();
            closeCart();
        }

        // Admin Management Actions
        async function addNewProduct() {
            const name = document.getElementById('newProdName').value;
            const price = parseFloat(document.getElementById('newProdPrice').value);
            const description = document.getElementById('newProdDesc').value;
            const image = document.getElementById('newProdImg').value;

            if (!name || !price || !image) {
                alert('Please provide item name, price, and image URL.');
                return;
            }

            const { error } = await supabase.from('products').insert([{ name, price, description, image }]);
            if (error) alert('Error: ' + error.message);
            else {
                alert('Item added!');
                fetchProducts();
            }
        }

        async function editProduct(id, currentName, currentPrice) {
            const newName = prompt('New Item Name:', currentName);
            const newPrice = prompt('New Price:', currentPrice);
            if (newName && newPrice) {
                const { error } = await supabase.from('products').update({ name: newName, price: parseFloat(newPrice) }).eq('id', id);
                if (error) alert('Error: ' + error.message);
                else fetchProducts();
            }
        }

        async function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                const { error } = await supabase.from('products').delete().eq('id', id);
                if (error) alert('Error: ' + error.message);
                else fetchProducts();
            }
        }

        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
